name: Wallapop GPU Monitor

on:
  # De ingebouwde 'schedule' trigger van GitHub bleek onbetrouwbaar (runs
  # bleven uit). In plaats daarvan triggert een externe cron-dienst
  # (cron-job.org) deze workflow elke 10 minuten via de GitHub API, met
  # hetzelfde 'workflow_dispatch' mechanisme als de handmatige knop.
  workflow_dispatch: {}

permissions:
  contents: write   # nodig om seen_ads.json / hits_log.json terug te committen

# Zorgt dat er nooit twee runs tegelijk proberen te committen/pushen — een
# nieuwe run wacht netjes tot de vorige klaar is, in plaats van te botsen.
concurrency:
  group: wallapop-gpu-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Monitor uitvoeren
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_HIT: ${{ secrets.DISCORD_WEBHOOK_HIT }}
          DISCORD_WEBHOOK_NEAR_MISS: ${{ secrets.DISCORD_WEBHOOK_NEAR_MISS }}
          DISCORD_WEBHOOK_SUSPICIOUS: ${{ secrets.DISCORD_WEBHOOK_SUSPICIOUS }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: python monitor.py

      - name: Status opslaan in de repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ads.json hits_log.json docs/index.html
          git diff --cached --quiet || git commit -m "Update monitor status"

          # Deze bestanden worden bij elke run volledig opnieuw gegenereerd —
          # bij een conflict met een andere (bijna-)gelijktijdige run mag onze
          # eigen (nieuwste) versie gewoon winnen. Let op: bij 'git rebase'
          # zijn 'ours'/'theirs' verwisseld t.o.v. een gewone merge — 'ours'
          # is dan de externe branch, 'theirs' is onze eigen commit. Vandaar
          # hier bewust '-X theirs' (niet 'ours') om onze versie te laten
          # winnen. Bij een resterende race (zeldzaam) proberen we het nog
          # een tweede keer.
          for i in 1 2; do
            if git pull --rebase -X theirs --autostash; then
              git push && break
            else
              git rebase --abort || true
              sleep 5
            fi
          done
