name: Wallapop GPU Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # laat je 'm ook handmatig starten via de Actions-tab

permissions:
  contents: write   # nodig om seen_ads.json / hits_log.json terug te committen

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Monitor uitvoeren
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: python monitor.py

      - name: Status opslaan in de repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ads.json hits_log.json docs/index.html
          git diff --cached --quiet || git commit -m "Update monitor status"
          git push
