name: Wallapop GPU Monitor

on:
  # De ingebouwde 'schedule' trigger van GitHub bleek onbetrouwbaar (runs
  # bleven uit). In plaats daarvan triggert een externe cron-dienst
  # (cron-job.org) deze workflow elke 10 minuten via de GitHub API, met
  # hetzelfde 'workflow_dispatch' mechanisme als de handmatige knop.
  workflow_dispatch: {}

permissions:
  contents: write   # nodig om seen_ads.json / hits_log.json terug te committen

# Zorgt dat er nooit twee runs tegelijk proberen te committen/pushen — een
# nieuwe run wacht netjes tot de vorige klaar is, in plaats van te botsen.
concurrency:
  group: wallapop-gpu-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Monitor uitvoeren
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: python monitor.py

      - name: Status opslaan in de repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ads.json hits_log.json docs/index.html
          git diff --cached --quiet || git commit -m "Update monitor status"
          git pull --rebase --autostash
          git push
